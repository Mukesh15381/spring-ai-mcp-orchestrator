spring.application.name=spring

# Machine-specific overrides (absolute paths, local credentials) live in
# application-local.properties, which is git-ignored. Copy
# application-local.properties.example to get started. Imported values override this file.
spring.config.import=optional:classpath:application-local.properties

# Link Spring Boot to local Ollama API
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=llama3.2

# PostgreSQL + pgvector (docker-compose.yaml starts one on 5432)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vectordb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Embeddings via Ollama (nomic-embed-text -> 768-dim vectors)
spring.ai.ollama.embedding.options.model=nomic-embed-text

# PgVector store
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# -------------------------------------------------------------
# MCP SERVER role: this app exposes LogDiagnosticTools over STDIO
# -------------------------------------------------------------
# Server metadata exposed during MCP handshake
spring.ai.mcp.server.name=log-analyzer-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC

# Run as a web application so the REST APIs are reachable (Tomcat defaults to 8080;
# 8090 is used to avoid clashing with other local servers).
# When this jar is launched as a STDIO MCP server (see .mcp.json), the launcher passes
# --spring.main.web-application-type=none so no Tomcat is started for that instance.
spring.main.web-application-type=servlet
server.port=${SERVER_PORT:8090}

# Disable banner and console logging (CRITICAL: anything on stdout corrupts the
# JSON-RPC stream when running as a STDIO MCP server)
spring.main.banner-mode=off
logging.pattern.console=
# Spring Boot logs go to a file instead (git-ignored)
logging.file.name=logs/mcp-server.log

# -------------------------------------------------------------
# MCP CLIENT role: this app connects to the Postgres MCP server
# -------------------------------------------------------------
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=spring-postgres-client
spring.ai.mcp.client.version=1.0.0
spring.ai.mcp.client.type=SYNC

# Spawns the PostgreSQL MCP server as a local subprocess over STDIO.
# Portable default: npx downloads @modelcontextprotocol/server-postgres on first use.
# Needs Node >= 18 and network access to the npm registry. If npx is slow or blocked,
# install the package once and point to it from application-local.properties
# (see application-local.properties.example).
spring.ai.mcp.client.stdio.connections.postgres-db.command=npx
spring.ai.mcp.client.stdio.connections.postgres-db.args[0]=-y
spring.ai.mcp.client.stdio.connections.postgres-db.args[1]=@modelcontextprotocol/server-postgres
spring.ai.mcp.client.stdio.connections.postgres-db.args[2]=${MCP_POSTGRES_URL:postgresql://postgres:postgres@localhost:5432/vectordb}
