org.gradle.jvmargs=-Xmx2048m
org.gradle.daemon=true

# Increase HTTP timeouts for slow/restricted networks (milliseconds)
systemProp.http.socketTimeout=120000
systemProp.http.connectionTimeout=120000
systemProp.https.socketTimeout=120000
systemProp.https.connectionTimeout=120000

# Gradle 9 itself needs JVM 17+. If your JAVA_HOME points to an older JDK, set
# org.gradle.java.home in ~/.gradle/gradle.properties (user-level, not committed).
